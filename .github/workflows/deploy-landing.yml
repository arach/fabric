name: Deploy Site

on:
  push:
    branches: [master]
    paths:
      - 'landing/**'
      - 'fabric-docs/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # Build landing page
      - name: Install landing dependencies
        working-directory: landing
        run: npm ci

      - name: Build landing
        working-directory: landing
        run: npm run build

      # Build docs site
      - name: Install docs dependencies
        working-directory: fabric-docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: fabric-docs
        run: pnpm run build

      # Merge into single artifact
      - name: Merge landing + docs
        run: |
          cp -r fabric-docs/dist landing/dist/docs
          cp landing/CNAME landing/dist/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
