name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (cli, core, or all)'
        required: true
        type: choice
        options:
          - cli
          - core
          - all
        default: cli
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        working-directory: packages/cli
        run: bun run build

      - name: Build core
        working-directory: packages/core
        run: bun run build

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Tag-triggered publish (publishes CLI + core)
      - name: Set CLI version (from tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/cli
        run: npm version ${{ steps.tag_version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Set core version (from tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/core
        run: npm version ${{ steps.tag_version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Publish CLI (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish core (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/core
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Manual publish
      - name: Publish CLI (manual)
        if: github.event_name == 'workflow_dispatch' && (inputs.package == 'cli' || inputs.package == 'all')
        working-directory: packages/cli
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would publish @fabric-ai/cli"
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish core (manual)
        if: github.event_name == 'workflow_dispatch' && (inputs.package == 'core' || inputs.package == 'all')
        working-directory: packages/core
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would publish fabric-ai-core"
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
